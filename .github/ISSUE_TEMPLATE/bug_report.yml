name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ovumcy-web
        - ovumcy-app
        - ovumcy-sync-community
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, deterministic steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, app/server version or commit, deployment shape (and Go/Docker/device as relevant).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
